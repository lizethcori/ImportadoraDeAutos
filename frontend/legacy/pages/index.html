<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Importadora Nissan</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-car"></i>
                    <h1>Importadora Nissan</h1>
                    <span class="tagline">Sistema Profesional</span>
                </div>
            </div>
            
            <div class="login-body">
                <form id="loginForm" class="login-form">
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user"></i>
                            Usuario
                        </label>
                        <input type="text" id="username" name="username" required 
                               placeholder="Ingrese su usuario" autocomplete="username">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i>
                            Contraseña
                        </label>
                        <div class="password-input">
                            <input type="password" id="password" name="password" required 
                                   placeholder="Ingrese su contraseña" autocomplete="current-password">
                            <button type="button" class="toggle-password" onclick="togglePassword()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="remember">
                            <span class="checkmark"></span>
                            Recordarme
                        </label>
                        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>
                    
                    <button type="button" class="btn btn-primary btn-full" onclick="manualLogin()">
                        <i class="fas fa-sign-in-alt"></i>
                        Iniciar Sesión
                    </button>
                </form>
                
                <div class="auth-divider">
                    <span>O accede como</span>
                </div>
                
                <div class="demo-accounts">
                    <button class="btn btn-outline" onclick="loginDemo('admin')">
                        <i class="fas fa-user-shield"></i>
                        Administrador
                    </button>
                    <button class="btn btn-outline" onclick="loginDemo('vendedor')">
                        <i class="fas fa-user-tie"></i>
                        Vendedor
                    </button>
                    <button class="btn btn-outline" onclick="loginDemo('cliente')">
                        <i class="fas fa-user"></i>
                        Cliente
                    </button>
                </div>
            </div>
            
            <div class="login-footer">
                <p>&copy; 2024 Importadora Nissan. Todos los derechos reservados.</p>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p>Iniciando sesión...</p>
    </div>

    <!-- Message Container -->
    <div id="messageContainer" class="message-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/login.js"></script>
</body>
</html>
